name: Probe NBER access (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
    steps:
      - name: Check what NBER allows automated clients to read (honest user agent, one request each)
        run: |
          UA="cf-research-updates/1.0 (+https://github.com/stathismag/cf-research-updates; mailto:${CROSSREF_EMAIL})"
          probe() {
            echo "=================== $1"
            curl -sS -m 40 -A "$UA" -o /tmp/p.out -w "HTTP %{http_code} type=%{content_type} size=%{size_download}\n" "$1" 2>&1 || true
            head -c 600 /tmp/p.out | tr '\n' ' ' | cut -c1-600; echo
            echo "paper links: $(grep -o '/papers/w[0-9]\{4,6\}' /tmp/p.out | sort -u | wc -l)"
          }
          probe "https://www.nber.org/robots.txt"
          probe "https://www.nber.org/rss/new.xml"
          probe "https://www.nber.org/programs-projects/programs-working-groups/corporate-finance"
          probe "https://api.crossref.org/works?filter=prefix:10.3386&rows=2&sort=created&order=desc&select=DOI,title,created"
