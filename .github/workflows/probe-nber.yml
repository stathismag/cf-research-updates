name: Probe NBER access (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
    steps:
      - name: Read robots.txt in full and inspect how the program page loads its paper list
        run: |
          UA="cf-research-updates/1.0 (+https://github.com/stathismag/cf-research-updates; mailto:${CROSSREF_EMAIL})"
          echo "=========== robots.txt"; curl -sS -m 40 -A "$UA" https://www.nber.org/robots.txt | grep -v '^#' | grep -v '^$'
          curl -sS -m 40 -A "$UA" -o /tmp/page.html https://www.nber.org/programs-projects/programs-working-groups/corporate-finance
          echo "=========== page: size $(wc -c < /tmp/page.html)"
          echo "--- api / listing / json hints:"
          grep -o -i '[^"'"'"' ]*\(api/v1\|working_page_listing\|/search\?\)[^"'"'"' ]*' /tmp/page.html | sort -u | head -20
          echo "--- script/data attributes mentioning program/CF:"
          grep -o -i '\(data-[a-z-]*\|"program[a-z_]*"\)=\?"\?[^" >]\{0,80\}' /tmp/page.html | sort -u | head -20
          echo "--- title/links containing 'working' near 'paper':"
          grep -o '<a [^>]*href="[^"]*/papers/[^"]*"[^>]*>' /tmp/page.html | head -5
          grep -o 'drupalSettings[^<]\{0,300\}' /tmp/page.html | head -3
          echo "--- script tags:"; grep -o '<script[^>]*src="[^"]*"' /tmp/page.html | head -15
