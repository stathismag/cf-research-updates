name: Update research listings

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 06:00 UTC on the 1st and 15th of every month
  workflow_dispatch:         # also lets you run it by hand from the Actions tab
    inputs:
      days:
        description: "Optional: look back this many days instead of since the last run (e.g. 14)"
        required: false
        default: ""
      send_email:
        description: "Send the Buttondown newsletter on this manual run"
        required: false
        type: boolean
        default: false
      publish:
        description: "Commit generated files and trigger the production deploy"
        required: false
        type: boolean
        default: false

concurrency:                 # never run two updates at once (they would overwrite each other)
  group: update-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}   # Settings → Secrets and variables → Actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Static syntax and config checks
        run: |
          python -m py_compile scripts/fetch_papers.py scripts/build_site.py scripts/send_digest.py scripts/validate_update.py
          python -m json.tool scripts/config.json > /dev/null

      - name: Verify upstream sources
        run: python scripts/fetch_papers.py --check

      - name: Fetch new papers
        run: python scripts/fetch_papers.py ${DAYS:+--days "$DAYS"}
        env:
          DAYS: ${{ inputs.days }}

      - name: Validate fetched data
        run: python scripts/validate_update.py

      - name: Build crawlable site and archive
        run: python scripts/build_site.py

      - name: Validate generated site and digest
        run: |
          python scripts/validate_update.py --site
          python scripts/send_digest.py --dry-run > /tmp/digest.txt
          test -s /tmp/digest.txt
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          m=re.search(r"<script>(.*?)</script>",s,re.S)
          if not m:
              raise SystemExit("No inline script found")
          Path("/tmp/site.js").write_text(m.group(1),encoding="utf-8")
          PY
          node --check /tmp/site.js

      - name: Email the digest to subscribers
        if: github.event_name == 'schedule' || inputs.send_email == true
        run: python scripts/send_digest.py
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: https://corporatefinanceupdates.com

      - name: Commit generated files if publishing
        if: github.event_name == 'schedule' || inputs.publish == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json sent.json index.html issues archive sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update listings $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
