name: Update research listings

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 06:00 UTC on the 1st and 15th: scheduled runs publish and email
  workflow_dispatch:         # manual runs only publish/email when the boxes below are ticked
    inputs:
      days:
        description: "Optional: look back this many days instead of since the last run (e.g. 14)"
        required: false
        default: ""
      send_email:
        description: "Send the Buttondown newsletter on this manual run"
        required: false
        type: boolean
        default: false
      publish:
        description: "Commit generated files and trigger the production deploy"
        required: false
        type: boolean
        default: false

concurrency:                 # never run two updates at once (they would overwrite each other)
  group: update-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}   # Settings → Secrets and variables → Actions
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Refresh NBER Corporate Finance cache
        # Reads NBER's own program listing. If NBER is unreachable the committed cache is used instead,
        # and the static audit below rejects it when it is older than cache_warn_days.
        continue-on-error: true
        run: python scripts/refresh_nber_cache.py

      - name: Static syntax and config checks
        run: |
          python -m py_compile scripts/fetch_papers.py scripts/build_site.py scripts/send_digest.py scripts/validate_update.py scripts/static_audit.py scripts/refresh_nber_cache.py
          python -m json.tool scripts/config.json > /dev/null
          python -m json.tool cache/nber_cf_program.json > /dev/null
          python scripts/static_audit.py
          python - <<'PY'
          import tomllib
          from pathlib import Path
          tomllib.loads(Path("netlify.toml").read_text(encoding="utf-8"))
          for required in ("favicon.png","linkedin-preview.png"):
              if not Path(required).is_file():
                  raise SystemExit(f"Missing required site asset: {required}")
          PY

      - name: Verify upstream sources
        run: python scripts/fetch_papers.py --check

      - name: Fetch new papers
        run: python scripts/fetch_papers.py ${DAYS:+--days "$DAYS"}
        env:
          DAYS: ${{ inputs.days }}

      - name: Validate fetched data
        run: python scripts/validate_update.py

      - name: Require healthy optional sources in validation mode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data.json").read_text(encoding="utf-8"))
          h=d.get("source_health") or {}
          bad={k:(h.get(k) or {}) for k in ("nber","ssrn") if (h.get(k) or {}).get("status")!="ok"}
          if bad:
              raise SystemExit(f"Optional source validation failed: {bad}")
          print("OPTIONAL SOURCE HEALTH PASS: NBER=ok, SSRN=ok")
          PY

      - name: Build crawlable site and archive
        run: python scripts/build_site.py

      - name: Validate generated site and digest
        run: |
          python scripts/validate_update.py --site
          python scripts/send_digest.py --dry-run > /tmp/digest.txt
          test -s /tmp/digest.txt
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          m=re.search(r"<script>(.*?)</script>",s,re.S)
          if not m:
              raise SystemExit("No inline script found")
          Path("/tmp/site.js").write_text(m.group(1),encoding="utf-8")
          PY
          node --check /tmp/site.js

      - name: Upload manual-run validation snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: update-preview-${{ github.run_number }}
          path: data.json
          retention-days: 7
          if-no-files-found: error

      - name: Commit generated files if publishing
        if: github.event_name == 'schedule' || inputs.publish == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html issues archive sitemap.xml robots.txt cache/nber_cf_program.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update listings $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Email the digest to subscribers
        if: github.event_name == 'schedule' || (inputs.send_email == true && inputs.publish == true)
        run: python scripts/send_digest.py
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: https://corporatefinanceupdates.com

      - name: Record emailed papers
        if: github.event_name == 'schedule' || (inputs.send_email == true && inputs.publish == true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          if ! git diff --cached --quiet; then
            git commit -m "Record emailed papers $(date -u +%Y-%m-%d) [skip netlify]"
            git pull --rebase origin main
            git push
          fi
