[build]
  command = "python3 -m pip install --quiet pillow && python3 scripts/build_social_preview.py"
  publish = "."

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "no-cache"



[[headers]]
  for = "/social-preview.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"


[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "upgrade-insecure-requests; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


[[headers]]
  for = "/linkedin-preview.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "image/jpeg"


[[headers]]
  for = "/social-preview.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "image/jpeg"
