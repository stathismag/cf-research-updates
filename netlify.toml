[build]
  publish = "."

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "no-cache"


[[redirects]]
  from = "/social-preview.jpg"
  to = "/.netlify/images?url=/social-preview.svg&w=1200&h=627&fit=cover&fm=jpg&q=90"
  status = 200
  force = true

[[headers]]
  for = "/social-preview.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
