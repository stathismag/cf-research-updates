[[redirects]]
  from = "/linkedin-preview.png"
  to = "/linkedin-preview-v4.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/social-preview.jpg"
  to = "/linkedin-preview-v4.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/social-preview.svg"
  to = "/linkedin-preview-v4.jpg"
  status = 301
  force = true

[build]
  publish = "."
  ignore = 'git log -1 --pretty=%B $COMMIT_REF | grep -q "\[skip netlify\]" || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html data.json conferences.json jobs.json issues archive sitemap.xml robots.txt netlify.toml favicon.png linkedin-preview-v4.jpg'

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "no-cache"



[[headers]]
  for = "/social-preview.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"


[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "upgrade-insecure-requests; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"




[[headers]]
  for = "/social-preview.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "image/jpeg"


[[headers]]
  for = "/linkedin-preview.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/linkedin-preview-v4.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"


[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
    Content-Type = "image/png"
