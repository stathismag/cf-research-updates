<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
<title id="title">Corporate Finance Updates</title>
<desc id="desc">Bi-weekly research digest for corporate finance.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1728"/>
    <stop offset="0.58" stop-color="#0f2638"/>
    <stop offset="1" stop-color="#0b1d2d"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c7d1da" stop-opacity=".72"/>
    <stop offset="1" stop-color="#728698" stop-opacity=".38"/>
  </linearGradient>
</defs>
<rect width="1200" height="627" fill="url(#bg)"/>

<!-- subtle finance bars -->
<g fill="#1c6271" opacity=".18">
  <rect x="770" y="315" width="24" height="190"/>
  <rect x="810" y="255" width="24" height="250"/>
  <rect x="850" y="350" width="24" height="155"/>
  <rect x="890" y="205" width="24" height="300"/>
  <rect x="930" y="285" width="24" height="220"/>
  <rect x="970" y="145" width="24" height="360"/>
  <rect x="1010" y="235" width="24" height="270"/>
  <rect x="1050" y="90" width="24" height="415"/>
</g>

<!-- abstract globe/network -->
<g opacity=".48" fill="none">
  <circle cx="1010" cy="165" r="142" stroke="#2b8ea0" stroke-width="2"/>
  <ellipse cx="1010" cy="165" rx="142" ry="58" stroke="#2b8ea0"/>
  <ellipse cx="1010" cy="165" rx="72" ry="142" stroke="#2b8ea0"/>
  <path d="M870 175 C930 100 1050 85 1150 145" stroke="#4ea8b5" stroke-width="1.5"/>
  <path d="M865 220 C940 160 1060 190 1150 115" stroke="#4ea8b5" stroke-width="1.5"/>
</g>
<g fill="#d1a33b">
  <circle cx="905" cy="123" r="5"/><circle cx="958" cy="82" r="4"/><circle cx="1095" cy="137" r="5"/>
</g>
<g fill="#1fa59a">
  <circle cx="873" cy="209" r="5"/><circle cx="1048" cy="199" r="5"/>
</g>

<!-- stylized research papers -->
<g transform="translate(880 340) rotate(-9)">
  <rect x="0" y="0" width="210" height="220" rx="5" fill="url(#paper)" opacity=".55"/>
  <g stroke="#344f64" stroke-width="4" opacity=".55">
    <line x1="24" y1="38" x2="172" y2="38"/>
    <line x1="24" y1="57" x2="160" y2="57"/>
    <line x1="24" y1="76" x2="180" y2="76"/>
  </g>
  <g fill="#24465a" opacity=".7">
    <rect x="32" y="155" width="18" height="38"/><rect x="61" y="140" width="18" height="53"/>
    <rect x="90" y="120" width="18" height="73"/><rect x="119" y="101" width="18" height="92"/>
  </g>
</g>
<g transform="translate(1005 350) rotate(6)">
  <rect x="0" y="0" width="210" height="225" rx="5" fill="url(#paper)" opacity=".72"/>
  <g stroke="#344f64" stroke-width="4" opacity=".58">
    <line x1="25" y1="40" x2="175" y2="40"/>
    <line x1="25" y1="60" x2="158" y2="60"/>
    <line x1="25" y1="80" x2="180" y2="80"/>
    <line x1="25" y1="100" x2="145" y2="100"/>
  </g>
</g>

<!-- title -->
<text x="62" y="146" fill="#f6f3ea" font-size="82" font-weight="700" font-family="Georgia, Times New Roman, serif">Corporate</text>
<text x="62" y="230" fill="#f6f3ea" font-size="82" font-weight="700" font-family="Georgia, Times New Roman, serif">Finance Updates</text>
<rect x="66" y="266" width="70" height="5" rx="2.5" fill="#c99835"/>
<text x="62" y="338" fill="#69c3bb" font-size="40" font-weight="600" font-family="Georgia, Times New Roman, serif">Bi-weekly research digest</text>
<text x="62" y="385" fill="#edf1f2" font-size="26" font-family="Georgia, Times New Roman, serif">New papers, working papers, conferences, and jobs</text>
<text x="62" y="420" fill="#edf1f2" font-size="26" font-family="Georgia, Times New Roman, serif">in corporate finance</text>

<!-- themes -->
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#eef1ef">
  <text x="62" y="492">Climate</text>
  <circle cx="157" cy="485" r="4" fill="#c99835"/>
  <text x="178" y="492">Cybersecurity</text>
  <circle cx="320" cy="485" r="4" fill="#c99835"/>
  <text x="340" y="492">AI</text>
  <circle cx="382" cy="485" r="4" fill="#c99835"/>
  <text x="402" y="492">ESG</text>
  <circle cx="456" cy="485" r="4" fill="#c99835"/>
  <text x="478" y="492">Political Geography</text>
</g>
<line x1="62" y1="540" x2="770" y2="540" stroke="#6d8392" stroke-opacity=".45"/>
<text x="62" y="582" fill="#9fb2c2" font-size="22" font-family="Georgia, Times New Roman, serif">Curated by</text>
<text x="176" y="582" fill="#d1a33b" font-size="22" font-weight="700" font-family="Georgia, Times New Roman, serif">Efstathios Magerakis</text>
</svg>